[project]
name = "rawclean"
version = "0.1.0"
description = "Find and remove camera RAW files that have a JPEG copy, safely via a quarantine folder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rawclean = "rawclean.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9.21,<0.10"]
build-backend = "uv_build"
