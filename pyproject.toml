[project]
name = "rawclean"
version = "0.2.0"
description = "Find and remove camera RAW files, safely via a quarantine folder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
rawclean = "rawclean.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9.21,<0.10"]
build-backend = "uv_build"
